
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>KasirKu</title>
<style>
:root{--g:#16a34a;--gd:#15803d;--bg:#f3f4f6;--line:#e5e7eb;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#111827;font-family:system-ui,Arial,sans-serif}
header{background:var(--g);color:white;padding:15px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}
header small{display:block}
nav{display:flex;background:white;position:sticky;top:66px;z-index:4}
nav button{flex:1;padding:14px 4px;border:0;border-bottom:3px solid transparent;background:white;color:#6b7280;font-weight:bold}
nav button.active{color:var(--g);border-color:var(--g)}
main{max-width:900px;margin:auto;padding:14px}
.tab{display:none}.tab.active{display:block}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;background:white}
label{display:block;margin:10px 0 6px;font-size:14px}
button{cursor:pointer;touch-action:manipulation}
.btn{border:0;border-radius:9px;background:var(--g);color:white;padding:11px 14px;font-weight:bold}
.gray{background:#e5e7eb;color:#111827}.red{background:var(--red)}
.btn:disabled{opacity:.45}
.card{background:white;padding:15px;border-radius:14px;margin-top:12px;box-shadow:0 1px 3px #0001}
h2{font-size:21px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.product{padding:13px;border:1px solid var(--line);border-radius:10px;background:white;text-align:left;overflow-wrap:anywhere}
.product b,.product small{display:block}.product .price{display:block;color:var(--gd);font-weight:bold;margin-top:6px}
.product small{color:#6b7280;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.details{min-width:0;overflow-wrap:anywhere}.details small{color:#6b7280}
.qty{display:flex;align-items:center;gap:7px;flex-shrink:0}
.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:white;font-size:17px}
.total{display:flex;justify-content:space-between;gap:8px;padding:13px 0;font-size:20px;font-weight:bold}
.actions{display:flex;gap:8px}.actions button{flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.quick button{font-size:12px;padding:7px 10px}
.empty{text-align:center;padding:17px;color:#9ca3af}
.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.formgrid .full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.stat{background:white;border-radius:12px;padding:14px}
.stat small{color:#6b7280}.stat b{display:block;font-size:21px;margin-top:5px;overflow-wrap:anywhere}
.note{font-size:13px;color:#6b7280;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}
.modal.open{display:flex}.modalbox{background:white;padding:16px;border-radius:12px;width:100%;max-width:360px;max-height:90vh;overflow:auto}
#receipt{font-family:monospace;font-size:13px;color:#111}
#receipt .center{text-align:center}#receipt .rr{display:flex;justify-content:space-between;gap:8px}
#receipt hr{border:0;border-top:1px dashed #333;margin:8px 0}
#toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:12px 16px;border-radius:9px;z-index:40;max-width:90%}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:500px){.formgrid{grid-template-columns:1fr 1fr}.formgrid .name,.formgrid .full{grid-column:1/-1}}
@media print{body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{position:absolute;top:0;left:0;width:58mm}.modal,.modalbox{position:static;display:block;background:white;box-shadow:none;padding:0;max-height:none;overflow:visible}.modalbox .actions{display:none}}
</style>
</head>
<body>
<header>
<h1>🛒 KasirKu</h1>
<small id="storeHeader">Warung Saya</small>
</header>

<nav>
<button class="active" data-tab="kasir">Kasir</button>
<button data-tab="produk">Produk</button>
<button data-tab="laporan">Laporan</button>
<button data-tab="atur">Pengaturan</button>
</nav>

<main>
<section id="kasir" class="tab active">
<input id="search" type="search" placeholder="🔍 Cari barang...">
<div id="products" class="grid"></div>

<div class="card">
<h2>Keranjang</h2>
<div id="cart"></div>
<div class="total"><span>Total</span><span id="total">Rp 0</span></div>
<label for="cash">Uang diterima</label>
<input id="cash" type="number" min="0" inputmode="numeric" placeholder="Masukkan uang">
<div id="quick" class="quick"></div>
<div class="total" style="font-size:17px"><span>Kembalian</span><span id="change">Rp 0</span></div>
<div class="actions">
<button class="btn gray" id="clearCart">Kosongkan</button>
<button class="btn" id="pay" disabled>BAYAR</button>
</div>
</div>
</section>

<section id="produk" class="tab">
<div class="card">
<h2 id="formTitle">Tambah Barang</h2>
<form id="productForm" class="formgrid">
<div class="name"><label>Nama barang</label><input id="pName" required maxlength="100" placeholder="Nama barang"></div>
<div><label>Harga (Rp)</label><input id="pPrice" type="number" min="0" step="1" required placeholder="Harga"></div>
<div><label>Stok</label><input id="pStock" type="number" min="0" step="1" required placeholder="Stok"></div>
<div class="full"><button class="btn" id="saveProduct" type="submit">Simpan Barang</button>
<button class="btn gray" id="cancelEdit" type="button" hidden>Batal Edit</button></div>
</form>
</div>
<div class="card">
<input id="adminSearch" type="search" placeholder="🔍 Cari barang...">
<div id="productList"></div>
</div>
</section>

<section id="laporan" class="tab">
<div class="card"><label>Tanggal laporan</label><input id="date" type="date"></div>
<div class="stats">
<div class="stat"><small>Omzet</small><b id="revenue">Rp 0</b></div>
<div class="stat"><small>Transaksi</small><b id="count">0</b></div>
</div>
<div class="card"><h2>Riwayat Transaksi</h2><div id="history"></div></div>
<button class="btn gray" id="csv" style="width:100%;margin-top:12px">⬇ Unduh Laporan CSV</button>
</section>

<section id="atur" class="tab">
<div class="card">
<h2>Pengaturan Toko</h2>
<label>Nama toko</label><input id="shopName" placeholder="Nama toko">
<label>Alamat / nomor HP</label><input id="shopAddress" placeholder="Opsional">
<button class="btn" id="saveSettings" style="width:100%;margin-top:12px">Simpan Pengaturan</button>
</div>
<div class="card">
<h2>Cadangkan Data</h2>
<p class="note">Data tersimpan di browser perangkat ini. Unduh cadangan secara berkala agar data tidak mudah hilang.</p>
<div class="actions">
<button class="btn" id="backup">Unduh Cadangan</button>
<button class="btn gray" id="restore">Pulihkan Data</button>
</div>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>
</div>
<div class="card"><button class="btn red" id="deleteAll" style="width:100%">Hapus Semua Data</button></div>
</section>
</main>

<div class="modal" id="modal">
<div class="modalbox">
<div id="receipt"></div>
<div class="actions" style="margin-top:14px">
<button class="btn gray" id="closeReceipt">Tutup</button>
<button class="btn" id="print">Cetak Struk</button>
</div>
</div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='kasirku_v3';
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const dateOf=t=>{let d=new Date(t);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
let db={products:[],sales:[],settings:{name:'Warung Saya',address:''}};
let cart=[],editing=null,timer;

function toast(s){
 $('toast').textContent=s;$('toast').style.display='block';
 clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2300);
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));return true}
 catch(e){toast('Gagal menyimpan data. Unduh cadangan!');return false}
}
function load(){
 try{
  let d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d&&Array.isArray(d.products)&&Array.isArray(d.sales)&&d.settings)
   db=d;
 }catch(e){}
 if(!localStorage.getItem(KEY)){
  db.products=[
   {id:uid(),name:'Mi Instan',price:3500,stock:40},
   {id:uid(),name:'Air Mineral 600 ml',price:4000,stock:24},
   {id:uid(),name:'Kopi Sachet',price:2000,stock:50},
   {id:uid(),name:'Telur (butir)',price:2500,stock:30}
  ];
  save();
 }
 if(!db.settings)db.settings={name:'Warung Saya',address:''};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));
 if(b.dataset.tab==='produk')renderList();
 if(b.dataset.tab==='laporan')renderReport();
 if(b.dataset.tab==='atur')renderSettings();
 if(b.dataset.tab==='kasir')renderProducts();
});

function renderProducts(){
 let q=$('search').value.toLowerCase();
 let list=db.products.filter(p=>p.name.toLowerCase().includes(q));
 $('products').innerHTML=list.length?list.map(p=>`
 <button class="product" data-add="${esc(p.id)}" ${p.stock<=0?'disabled':''}>
 <b>${esc(p.name)}</b><span class="price">${rp(p.price)}</span>
 <small>Stok: ${p.stock}</small></button>`).join(''):
 '<div class="empty">Barang tidak ditemukan.</div>';
 $('products').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
}
$('search').oninput=renderProducts;

function add(id){
 let p=db.products.find(x=>x.id===id);if(!p)return;
 let k=cart.find(x=>x.id===id);
 if((k?k.qty:0)>=p.stock){toast('Stok tidak cukup!');return}
 if(k)k.qty++;
 else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});
 renderCart();
}
function qty(id,delta){
 let k=cart.find(x=>x.id===id);if(!k)return;
 let p=db.products.find(x=>x.id===id);
 if(delta>0&&(!p||k.qty>=p.stock)){toast('Stok tidak cukup!');return}
 k.qty+=delta;
 if(k.qty<=0)cart=cart.filter(x=>x.id!==id);
 renderCart();
}
const sum=()=>cart.reduce((s,k)=>s+k.price*k.qty,0);

function renderCart(){
 $('cart').innerHTML=cart.length?cart.map(k=>`
 <div class="row"><div class="details"><b>${esc(k.name)}</b><br>
 <small>${rp(k.price)} × ${k.qty} = ${rp(k.price*k.qty)}</small></div>
 <div class="qty"><button data-id="${esc(k.id)}" data-d="-1">−</button>
 <b>${k.qty}</b><button data-id="${esc(k.id)}" data-d="1">+</button></div></div>`).join(''):
 '<div class="empty">Belum ada barang. Ketuk barang di atas.</div>';
 $('cart').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>qty(b.dataset.id,+b.dataset.d));
 $('total').textContent=rp(sum());
 let t=sum();
 let options=[...new Set([t,5000,10000,20000,50000,100000].filter(x=>x>=t&&x>0))].sort((a,b)=>a-b).slice(0,5);
 $('quick').innerHTML=options.map(x=>`<button class="btn gray" data-cash="${x}">${x===t?'Uang pas':rp(x)}</button>`).join('');
 $('quick').querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>{$('cash').value=b.dataset.cash;calc()});
 calc();
}
function calc(){
 let change=(Number($('cash').value)||0)-sum();
 $('change').textContent=rp(Math.max(0,change));
 $('change').style.color=change<0&&$('cash').value?'var(--red)':'inherit';
 $('pay').disabled=!(cart.length&&Number($('cash').value)>=sum());
}
$('cash').oninput=calc;
$('clearCart').onclick=()=>{cart=[];$('cash').value='';renderCart()};
$('pay').onclick=()=>{
 let total=sum(),cash=Number($('cash').value)||0;
 if(!cart.length||cash<total)return;
 for(let k of cart){
  let p=db.products.find(x=>x.id===k.id);
  if(!p||p.stock<k.qty){toast('Stok tidak cukup. Periksa keranjang.');return}
 }
 cart.forEach(k=>{db.products.find(p=>p.id===k.id).stock-=k.qty});
 let sale={id:uid(),time:Date.now(),items:cart.map(x=>({...x})),total,cash,change:cash-total};
 db.sales.push(sale);save();
 showReceipt(sale);
 cart=[];$('cash').value='';
 renderCart();renderProducts();
};
function showReceipt(s){
 let d=new Date(s.time);
 $('receipt').innerHTML=`
 <div class="center"><b>${esc(db.settings.name)}</b><br>${esc(db.settings.address||'')}<br></div>
 <hr>${d.toLocaleDateString('id-ID')} ${d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<hr>
 ${s.items.map(i=>`<div>${esc(i.name)}</div><div class="rr"><span>${i.qty} × ${Number(i.price).toLocaleString('id-ID')}</span><span>${(i.qty*i.price).toLocaleString('id-ID')}</span></div>`).join('')}
 <hr><div class="rr"><b>TOTAL</b><b>${rp(s.total)}</b></div>
 <div class="rr"><span>Bayar</span><span>${rp(s.cash)}</span></div>
 <div class="rr"><span>Kembali</span><span>${rp(s.change)}</span></div><hr><div class="center">Terima kasih 🙏</div>`;
 $('modal').classList.add('open');
}
$('closeReceipt').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('print').onclick=()=>window.print();

function resetForm(){
 editing=null;$('productForm').reset();$('formTitle').textContent='Tambah Barang';
 $('saveProduct').textContent='Simpan Barang';$('cancelEdit').hidden=true;
}
$('cancelEdit').onclick=resetForm;
$('productForm').onsubmit=e=>{
 e.preventDefault();
 let name=$('pName').value.trim(),price=Number($('pPrice').value),stock=Number($('pStock').value);
 if(!name||!Number.isInteger(price)||price<0||!Number.isInteger(stock)||stock<0){
  toast('Periksa nama, harga, dan stok.');return;
 }
 if(editing){
  let p=db.products.find(x=>x.id===editing);
  if(p){p.name=name;p.price=price;p.stock=stock}
  cart=cart.filter(k=>db.products.some(p=>p.id===k.id));
  toast('Barang berhasil diubah.');
 }else{
  db.products.push({id:uid(),name,price,stock});
  toast('Barang berhasil ditambahkan.');
 }
 save();resetForm();renderProducts();renderList();renderCart();
};
$('adminSearch').oninput=renderList;
function renderList(){
 let q=$('adminSearch').value.toLowerCase();
 let list=db.products.filter(p=>p.name.toLowerCase().includes(q));
 $('productList').innerHTML=list.length?list.map(p=>`
 <div class="row"><div class="details"><b>${esc(p.name)}</b><br>
 <small>${rp(p.price)} · Stok ${p.stock}</small></div>
 <div style="display:flex;gap:5px;flex-shrink:0">
 <button class="btn gray" data-edit="${esc(p.id)}">Ubah</button>
 <button class="btn red" data-del="${esc(p.id)}">Hapus</button></div></div>`).join(''):
 '<div class="empty">Belum ada barang.</div>';
 $('productList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
  let p=db.products.find(x=>x.id===b.dataset.edit);if(!p)return;
  editing=p.id;$('pName').value=p.name;$('pPrice').value=p.price;$('pStock').value=p.stock;
  $('formTitle').textContent='Ubah Barang';$('saveProduct').textContent='Simpan Perubahan';$('cancelEdit').hidden=false;
  window.scrollTo({top:0,behavior:'smooth'});
 });
 $('productList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
  let p=db.products.find(x=>x.id===b.dataset.del);if(!p)return;
  if(!confirm('Hapus '+p.name+'?'))return;
  db.products=db.products.filter(x=>x.id!==p.id);
  cart=cart.filter(x=>x.id!==p.id);
  if(editing===p.id)resetForm();
  save();renderList();renderProducts();renderCart();toast('Barang dihapus.');
 });
}

$('date').value=today();
$('date').onchange=renderReport;
function renderReport(){
 let date=$('date').value||today();
 let sales=db.sales.filter(s=>dateOf(s.time)===date);
 $('revenue').textContent=rp(sales.reduce((a,s)=>a+s.total,0));
 $('count').textContent=sales.length;
 $('history').innerHTML=sales.length?[...sales].reverse().map(s=>`
 <div class="row"><div class="details"><b>${rp(s.total)}</b><br>
 <small>${new Date(s.time).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
 · ${s.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</small></div>
 <button class="btn" data-receipt="${esc(s.id)}">Struk</button></div>`).join(''):
 '<div class="empty">Belum ada transaksi pada tanggal ini.</div>';
 $('history').querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{
  let s=db.sales.find(x=>x.id===b.dataset.receipt);if(s)showReceipt(s);
 });
}
$('csv').onclick=()=>{
 let date=$('date').value||today();
 let sales=db.sales.filter(s=>dateOf(s.time)===date);
 let rows=[['Tanggal','Waktu','Transaksi','Barang','Jumlah','Harga','Subtotal','Total']];
 sales.forEach(s=>s.items.forEach(i=>rows.push([
  date,new Date(s.time).toLocaleTimeString('id-ID'),s.id,i.name,i.qty,i.price,i.qty*i.price,s.total
 ])));
 let text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 download(text,'laporan-'+date+'.csv','text/csv;charset=utf-8;');
 toast('Laporan berhasil diunduh.');
};
function renderSettings(){
 $('shopName').value=db.settings.name||'';
 $('shopAddress').value=db.settings.address||'';
 $('storeHeader').textContent=db.settings.name||'Warung Saya';
}
$('saveSettings').onclick=()=>{
 db.settings.name=$('shopName').value.trim()||'Warung Saya';
 db.settings.address=$('shopAddress').value.trim();
 save();renderSettings();toast('Pengaturan disimpan.');
};
function download(content,filename,type){
 let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('backup').onclick=()=>{
 download(JSON.stringify(db,null,2),'cadangan-kasirku.json','application/json');
 toast('Cadangan diunduh.');
};
$('restore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{
 let file=e.target.files[0];if(!file)return;
 try{
  let d=JSON.parse(await file.text());
  if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.settings)throw Error();
  if(!confirm('Pulihkan cadangan? Data sekarang akan diganti.'))return;
  db={products:d.products,sales:d.sales,settings:{name:d.settings.name||'Warung Saya',address:d.settings.address||''}};
  cart=[];$('cash').value='';resetForm();save();
  renderProducts();renderCart();renderList();renderReport();renderSettings();toast('Data dipulihkan.');
 }catch(err){toast('File cadangan tidak valid.')}
 finally{e.target.value=''}
};
$('deleteAll').onclick=()=>{
 if(!confirm('Hapus semua produk dan riwayat transaksi?'))return;
 db={products:[],sales:[],settings:{name:'Warung Saya',address:''}};
 cart=[];$('cash').value='';resetForm();save();
 renderProducts();renderCart();renderList();renderReport();renderSettings();
 toast('Semua data dihapus.');
};

load();
renderProducts();renderCart();renderList();renderReport();renderSettings();
})();
</script>
</body>
</html>
